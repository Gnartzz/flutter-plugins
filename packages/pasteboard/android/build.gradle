group = "one.mixin.pasteboard"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
// Built-in Kotlin: AGP >= 9 kompiliert Kotlin selbst und lehnt das Kotlin Gradle
// Plugin dann ab. KGP nur anwenden, wenn Built-in Kotlin NICHT aktiv ist: AGP < 9
// oder AGP 9 mit android.builtInKotlin=false (Flutters Vorlage fuer 3.47).
// Rueckportiert aus flutter_webrtc 1.6.0 (Muster) (HoneyCord, 2026-08-29).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty("android.builtInKotlin") ||
        Boolean.parseBoolean(project.property("android.builtInKotlin").toString()))
if (!builtInKotlinActive) {
    // pluginManager.apply statt "apply plugin:": Flutter erkennt KGP-Anwendung per
    // Text-Scan (kgpRegexGroovy) und warnt sonst trotz Bedingung - kuenftig Fehler.
    project.pluginManager.apply("kotlin-android")
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "one.mixin.pasteboard"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }


    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// Kotlin-JVM-Ziel: unter Built-in Kotlin (AGP 9) und KGP >= 1.9 gibt es
// kotlin.compilerOptions; nur altes KGP 1.8 kennt allein android.kotlinOptions
// (das unter Built-in Kotlin gar nicht existiert). Muster upstream
// flutter_webrtc 1.6.0 (HoneyCord, 2026-08-29).
def kotlinExt = project.extensions.findByName("kotlin")
if (kotlinExt?.hasProperty("compilerOptions")) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}
